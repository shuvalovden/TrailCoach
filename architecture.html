<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisu Coach — Architecture</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1117;
  color: #e6edf3;
  font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
header {
  padding: 22px 0 6px;
  text-align: center;
}
header h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #f59e0b;
}
header p { font-size: 12px; color: #6b7280; margin-top: 4px; }

#diagram { width: 100%; max-width: 1120px; padding: 0 8px; }
svg { width: 100%; height: auto; display: block; }

.node { cursor: pointer; }
.node rect, .node circle { transition: filter 0.18s; }
.node:hover rect, .node:hover circle { filter: brightness(1.35) drop-shadow(0 0 6px currentColor); }
.node text { pointer-events: none; user-select: none; }

.node-title  { font-size: 12.5px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; dominant-baseline: middle; }
.node-sub    { font-size: 10px;   fill: #8b949e;    text-anchor: middle; dominant-baseline: middle; }
.node-badge  { font-size: 9px;    fill: #fcd34d;    text-anchor: middle; dominant-baseline: middle; }
.edge-lbl    { font-size: 9.5px;  fill: #6b7280;    text-anchor: middle; dominant-baseline: middle; }

.edge { fill: none; stroke-width: 1.5; }

/* Controls */
#controls {
  display: flex; gap: 12px; align-items: center;
  padding: 10px 8px; flex-wrap: wrap; justify-content: center;
}
button {
  border: none; border-radius: 6px; padding: 7px 18px;
  font-size: 12px; font-weight: 700; cursor: pointer; transition: filter .15s;
}
button:hover { filter: brightness(1.2); }
#play-btn   { background: #f59e0b; color: #0d1117; }
#reset-btn  { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
#step-display {
  background: #161b22; border: 1px solid #30363d; border-radius: 6px;
  padding: 7px 16px; font-size: 12px; min-width: 320px; text-align: center; min-height: 34px;
}
/* Detail panel */
#detail {
  width: 100%; max-width: 1120px;
  padding: 0 8px 28px;
}
.dcard {
  background: #161b22; border: 1px solid #30363d;
  border-radius: 8px; padding: 14px 18px; margin-top: 6px;
}
.dcard h3 { font-size: 14px; margin-bottom: 6px; }
.dcard p  { font-size: 11.5px; color: #8b949e; line-height: 1.65; margin-bottom: 8px; }
.dcard pre {
  background: #0d1117; border: 1px solid #30363d; border-radius: 4px;
  padding: 10px 12px; font-size: 10.5px; font-family: 'Cascadia Code','Fira Code',monospace;
  color: #e6edf3; overflow-x: auto; line-height: 1.55; white-space: pre;
}
</style>
</head>

<script>
// ── Node detail data ──────────────────────────────────────────────────
const details = {
  user: {
    title: '👤 User — Denis Shuvalov',
    color: '#3b82f6',
    desc: 'Опытный любитель-трейлраннер из Трентино, Италия. Специализация: трейловый бег и вертикальные километры (VK). Взаимодействует с ботом через Telegram — отправляет вопросы о тренировках, получает советы на русском языке.',
    code:
`// Профиль в SYSTEM_PROMPT:
// Недавний результат: MIUT Marathon 40K за 5:40 (25 апреля 2026)
// Типичный объём: 30–40 км/нед
// Пульсовые зоны: Z1 <131 · Z2 131–145 · Z3 146–164 · Z4 165–175 · Z5 175+
// Сильные стороны: аэробная база от скитура, power hiking при HR 162+
// Риски: квадрицепсы на спусках >1000м, IT-тракт правого колена`
  },
  telegram: {
    title: '✈ Telegram Bot API',
    color: '#3b82f6',
    desc: 'Входящие сообщения доставляются через webhook. Верификация через заголовок X-Telegram-Bot-Api-Secret-Token. Сервер отвечает 200 немедленно, обработка — асинхронно (иначе Telegram будет ретраить).',
    code:
`// Верификация входящего webhook:
const token = req.headers['x-telegram-bot-api-secret-token'];
if (token !== process.env.TELEGRAM_WEBHOOK_SECRET) {
  return res.status(401).json({ error: 'Unauthorized' });
}
res.json({ ok: true }); // 200 сразу — Telegram не ждёт

// Отправка ответа (native fetch, без пакета):
async function sendTelegramMessage(chatId, text) {
  const url = \`https://api.telegram.org/bot\${TELEGRAM_BOT_TOKEN}/sendMessage\`;
  await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: chatId, text }),
  });
}`
  },
  server: {
    title: '⚡ server.js — Express Hub (Railway)',
    color: '#f59e0b',
    desc: 'Главный оркестратор. CommonJS-модуль на Node.js + Express. Роутинг по Telegram-командам (/sync30d, /feedback, /plan, текст), прямая OAuth2-интеграция со Strava, хранение в Supabase, генерация ответов через Claude.',
    code:
`// 7 routes:
// POST /webhook/telegram         ← /sync30d | /feedback | /plan | текст
// POST /webhook/strava/:secret   ← native Strava webhook (опционально)
// GET  /webhook/strava/:secret   ← Strava validation challenge
// GET  /health
// GET  /setup/strava-oauth       ← старт OAuth2 flow (one-time)
// GET  /setup/strava-callback    ← OAuth2 callback, сохраняет токены
// GET  /setup/strava-webhook     ← регистрация Strava push subscription

// 8 функций:
// getStravaToken()           — читает/обновляет OAuth2 токен из strava_config
// syncStravaActivities()     — GET /athlete/activities → upsert Supabase
// fetchStravaActivity(id)    — одна активность по ID (webhook flow)
// getCoachingResponse(txt)   — 30 дней, max_tokens: 500
// getFeedbackResponse()      — 7 дней, структурированный фидбек, max_tokens: 800
// getPlanResponse()          — 30 дней, план на неделю, max_tokens: 1000
// formatActivities(arr)      — D+/D-, HR, cadence, watts, кДж, [ИНТЕРВАЛЫ], лапы
// registerTelegramCommands() — setMyCommands при старте сервера`
  },
  claude: {
    title: '🔮 Claude API (Anthropic)',
    color: '#8b5cf6',
    desc: 'Языковая модель claude-sonnet-4-6. Получает системный промпт с профилем атлета и правилом краткости, текстовый summary тренировок и запрос. Отвечает на русском, 3–5 предложений по умолчанию.',
    code:
`// max_tokens по команде:
// getCoachingResponse  → 500   (текстовые вопросы)
// getFeedbackResponse  → 800   (/feedback, 7 дней)
// getPlanResponse      → 1000  (/plan, 30 дней)

const response = await anthropic.messages.create({
  model: 'claude-sonnet-4-6',
  max_tokens: 500,
  system: SYSTEM_PROMPT,  // профиль + правило краткости + зоны + план
  messages: [{
    role: 'user',
    content: \`Последние тренировки (30 дней):\\n\${summary}\\n\\nВопрос: \${userText}\`
  }]
});

// summary формат (новые поля):
// "DD.MM | TrailRun | 14.5 км | 105 мин | 7:14 мин/км
//  | 552м D+ / 489м D- | HR 148avg/168max | 172spm | 1316 кДж
//  | Лапы: 6×[4:05 мин/км | HR 162]"`
  },
  composio: {
    title: '🏃 Strava OAuth2 — прямая интеграция',
    color: '#f97316',
    desc: 'Strava используется напрямую через OAuth2 REST API без Composio. Токены хранятся в Supabase (таблица strava_config, id=1). При каждом запросе проверяется expiry — если до истечения < 5 минут, токен обновляется автоматически.',
    code:
`// Хранение токенов в Supabase:
// strava_config: { id, access_token, refresh_token, expires_at }

async function getStravaToken() {
  const { data } = await supabase
    .from('strava_config').select('*').eq('id', 1).single();

  if (Date.now() / 1000 > data.expires_at - 300) {
    // auto-refresh
    const r = await fetch('https://www.strava.com/oauth/token', {
      method: 'POST',
      body: JSON.stringify({ client_id, client_secret,
        grant_type: 'refresh_token', refresh_token: data.refresh_token }),
    });
    const refreshed = await r.json();
    await supabase.from('strava_config').upsert({ id: 1, ...refreshed });
    return refreshed.access_token;
  }
  return data.access_token;
}

let animTimer = null;
let stepIdx = 0;
let running = false;

function showDetail(id) {
  const d = details[id];
  if (!d) return;
  // Dim all nodes, highlight selected
  document.querySelectorAll('.node rect').forEach(r => r.style.filter = 'brightness(0.7)');
  const nEl = document.getElementById('n-' + id);
  if (nEl) nEl.querySelector('rect').style.filter = `brightness(1.4) drop-shadow(0 0 8px ${d.color})`;
  document.getElementById('detail').innerHTML =
    `<div class="dcard" style="border-color:${d.color}55">
      <h3 style="color:${d.color}">${d.title}</h3>
      <p>${d.desc}</p>
      <pre>${d.code}</pre>
    </div>`;
}

function highlightEdges(ids) {
  document.querySelectorAll('.edge').forEach(e => { e.style.opacity='0.15'; e.style.strokeWidth='1.5'; });
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.opacity='1'; el.style.strokeWidth='2.8'; }
  });
}

function resetAll() {
  stopFlow();
  document.querySelectorAll('.edge').forEach(e => { e.style.opacity=''; e.style.strokeWidth=''; });
  document.querySelectorAll('.node rect').forEach(r => r.style.filter = '');
  document.getElementById('step-display').textContent = 'Кликни на узел — увидишь детали кода · или запусти анимацию потока данных';
  document.getElementById('detail').innerHTML = '';
  document.getElementById('flow-dot').setAttribute('opacity', '0');
  document.getElementById('play-btn').textContent = '▶ Animate Flow';
}

function stopFlow() {
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  running = false;
}

function animateDot(pathD, color) {
  const svg = document.getElementById('svg');
  const dot = document.getElementById('flow-dot');
  const tmp = document.createElementNS('http://www.w3.org/2000/svg','path');
  tmp.setAttribute('d', pathD);
  svg.appendChild(tmp);
  const len = tmp.getTotalLength();
  svg.removeChild(tmp);
  dot.setAttribute('fill', color);
  dot.setAttribute('opacity', '1');
  let start = null;
  const dur = 900;
  function frame(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / dur, 1);
    const tmp2 = document.createElementNS('http://www.w3.org/2000/svg','path');
    tmp2.setAttribute('d', pathD);
    svg.appendChild(tmp2);
    const pt = tmp2.getPointAtLength(p * len);
    svg.removeChild(tmp2);
    dot.setAttribute('cx', pt.x);
    dot.setAttribute('cy', pt.y);
    if (p < 1) requestAnimationFrame(frame);
    else dot.setAttribute('opacity','0');
  }
  requestAnimationFrame(frame);
}

function runStep(i) {
  if (i >= steps.length) {
    stopFlow();
    document.getElementById('play-btn').textContent = '↺ Replay';
    document.getElementById('step-display').textContent = '✅ Цикл завершён — ответ доставлен пользователю';
    document.querySelectorAll('.edge').forEach(e => { e.style.opacity=''; e.style.strokeWidth=''; });
    stepIdx = 0;
    return;
  }
  const s = steps[i];
  highlightEdges(s.edges);
  document.getElementById('step-display').textContent = s.text;
  animateDot(s.path, s.dot);
}

function toggleFlow() {
  if (running) {
    stopFlow();
    document.getElementById('play-btn').textContent = '▶ Animate Flow';
    return;
  }
  running = true;
  document.getElementById('play-btn').textContent = '⏸ Pause';
  document.querySelectorAll('.node rect').forEach(r => r.style.filter = '');
  stepIdx = 0;
  runStep(stepIdx++);
  animTimer = setInterval(() => {
    if (!running) return;
    runStep(stepIdx++);
    if (stepIdx > steps.length) stopFlow();
  }, 1600);
}
